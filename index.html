<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Store</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>

<body>

    <!-- Header -->
    <header>
        <div class="container header-content">
            <div class="logo">LUMINA<span>STORE</span></div>
            <button class="cart-btn" id="cartBtn">
                🛒 <span id="cartCount">0</span>
            </button>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <div class="container">
            <h1>Технологии <br>будущего <span class="highlight">уже здесь</span></h1>
            <p>Минимализм. Стиль. Производительность.</p>
        </div>
    </section>

    <!-- Products Grid -->
    <main class="container">
        <div class="products-grid" id="productsGrid">
            <!-- Товары будут добавлены через JS -->
        </div>
    </main>

    <!-- Product Modal -->
    <div class="modal" id="productModal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <div class="modal-body">
                <div class="modal-image">
                    <img src="" alt="" id="modalImg">
                </div>
                <div class="modal-info">
                    <h2 id="modalTitle"></h2>
                    <p class="price" id="modalPrice"></p>
                    <p class="desc" id="modalDesc"></p>
                    <ul class="specs" id="modalSpecs"></ul>
                    <button class="add-to-cart-btn" id="modalAddBtn">Добавить в корзину</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Cart Sidebar -->
    <div class="cart-sidebar" id="cartSidebar">
        <div class="cart-header">
            <h2>Корзина</h2>
            <span class="close-cart">&times;</span>
        </div>
        <div class="cart-items" id="cartItems"></div>
        <div class="cart-footer">
            <div class="total">Итого: <span id="cartTotal">$0</span></div>
            <button class="checkout-btn">Оформить заказ</button>
        </div>
    </div>

    <div class="overlay" id="overlay"></div>

    <script src="script.js"></script>
</body>

</html>
